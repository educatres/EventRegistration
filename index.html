<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會議時間調查系統</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">GitHub Pages + Firebase</p>
          <h1>會議時間調查系統</h1>
        </div>
        <a class="primary-btn as-link" href="./create.html">建立新調查</a>
      </header>

      <img class="intro-image" src="./Intro.png" alt="會議時間調查系統介紹" />

      <section class="notice">
        <strong>隱私提醒</strong>
        <span>參加者不需登入或密鑰即可填寫。請勿輸入敏感個資；每個會議建立三週後，Firebase 資料會自動停止存取並清除。</span>
      </section>

      <div class="dashboard-grid">
        <section class="panel">
          <div class="section-heading">
            <p class="eyebrow">開始使用</p>
            <h2>快速建立會議調查</h2>
          </div>
          <p class="muted-text">設定候選日期與時段後，系統會產生參加者連結、結果連結，以及一組不會放進網址的六位數管理密鑰。</p>
          <a class="primary-btn as-link" href="./create.html">建立新的調查</a>
        </section>

        <section class="panel">
          <div class="section-heading">
            <p class="eyebrow">既有調查</p>
            <h2>使用連結或會議 ID 開啟</h2>
          </div>
          <form id="open-meeting-form">
            <label><span>會議連結或 ID</span><input name="meeting_reference" required placeholder="m000-000-000" autocomplete="off" /></label>
            <button class="ghost-btn" type="submit">查看結果</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <div class="section-heading inline-heading">
          <div><p class="eyebrow">本機記錄</p><h2>這個瀏覽器建立的會議</h2></div>
          <button id="clear-recent" class="ghost-btn small-btn" type="button">清除本機記錄</button>
        </div>
        <ul id="recent-meetings" class="recent-list"></ul>
      </section>
    </main>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
