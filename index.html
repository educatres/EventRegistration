<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="免登入的活動報名系統，支援自訂欄位、人數上限與資料下載。" />
    <title>EventRegistration 活動報名系統</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">EventRegistration</p>
          <h1>活動報名系統</h1>
        </div>
        <a class="primary-btn as-link" href="./create.html">建立報名表單</a>
      </header>

      <section class="notice">
        <strong>使用提醒</strong>
        <span>參加者不需要登入即可報名。請主辦人妥善保存管理連結與六位數密鑰；活動建立四週後，所有資料會停止存取並自動刪除。</span>
      </section>

      <div class="dashboard-grid">
        <section class="panel">
          <div class="section-heading">
            <p class="eyebrow">建立活動</p>
            <h2>快速建立匿名報名連結</h2>
          </div>
          <p class="muted-text">設定報名時間、人數上限、活動說明與自訂欄位後，即可取得分享連結與 QR Code。</p>
          <a class="primary-btn as-link" href="./create.html">建立新的報名表單</a>
        </section>

        <section class="panel">
          <div class="section-heading">
            <p class="eyebrow">主辦人管理</p>
            <h2>使用活動連結或 ID 進入</h2>
          </div>
          <form id="open-event-form">
            <label><span>管理連結或活動 ID</span><input name="event_reference" required placeholder="e000-000-000" autocomplete="off" /></label>
            <button class="ghost-btn" type="submit">開啟管理頁</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <div class="section-heading inline-heading">
          <div><p class="eyebrow">本機記錄</p><h2>這個瀏覽器建立的活動</h2></div>
          <button id="clear-recent" class="ghost-btn small-btn" type="button">清除本機記錄</button>
        </div>
        <ul id="recent-events" class="recent-list"></ul>
      </section>
    </main>

    <button id="system-events-trigger" class="system-events-trigger" type="button" aria-label="查看系統活動" title="系統活動">🔑</button>

    <dialog id="system-events-dialog" class="system-events-dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Firebase index</p>
          <h2>目前系統上的所有活動</h2>
        </div>
        <button id="system-events-close" class="ghost-btn small-btn" type="button">關閉</button>
      </div>
      <div class="actions">
        <button id="system-events-refresh" class="ghost-btn small-btn" type="button">重新整理</button>
        <span id="system-events-status" class="muted-text" aria-live="polite"></span>
      </div>
      <div class="table-wrap system-events-table-wrap">
        <table>
          <thead><tr><th>Firebase ID</th><th>預計刪除日期時間</th><th>狀態</th></tr></thead>
          <tbody id="system-events-body"></tbody>
        </table>
      </div>
    </dialog>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
