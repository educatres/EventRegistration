<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>活動報名｜EventRegistration</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="config-error" class="config-error hidden">
      <h1>報名連結不完整</h1><p>請向主辦人索取完整的活動報名連結。</p>
    </div>

    <main id="respond-app" class="shell hidden narrow-shell">
      <section id="event-info" class="panel event-info"></section>
      <form id="registration-form" class="panel">
        <div class="section-heading"><p class="eyebrow">Registration</p><h2>填寫報名資料</h2></div>
        <div class="two-col">
          <label><span>姓名 <b>*</b></span><input name="name" maxlength="100" autocomplete="name" required /></label>
          <label><span>Email <b>*</b></span><input name="email" type="email" maxlength="254" autocomplete="email" required /></label>
        </div>
        <label><span>電話（選填）</span><input name="phone" type="tel" maxlength="50" autocomplete="tel" /></label>
        <div id="custom-answer-fields"></div>
        <div class="actions"><button class="primary-btn" type="submit">送出報名</button></div>
        <p id="registration-status" class="status-line" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./js/respond.js"></script>
  </body>
</html>
