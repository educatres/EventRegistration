<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會議時間統計</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="config-error" class="config-error hidden">
      <h1>結果頁連結不完整</h1>
      <p>網址缺少 meeting_id，請向發起人索取完整連結。</p>
      <a class="primary-btn as-link" href="./index.html">回首頁</a>
    </div>

    <main id="results-app" class="shell hidden">
      <header class="page-header">
        <div>
          <p class="eyebrow">統計結果</p>
          <h1>會議可行時段</h1>
        </div>
        <div class="actions">
          <span id="sync-status" class="sync-pill">尚未同步</span>
        </div>
      </header>

      <section class="dashboard-grid">
        <div id="result-info" class="panel"></div>
        <div class="panel qr-panel">
          <label><span>參加者連結</span><textarea id="participant-link" rows="3" readonly></textarea></label>
          <div id="qr-code" class="qr-code"></div>
        </div>
      </section>

      <section class="panel admin-panel">
        <div class="section-heading">
          <p class="eyebrow">管理權限</p>
          <h2>輸入六位數管理密鑰</h2>
        </div>
        <form id="admin-form" class="admin-form">
          <label><span>管理密鑰（不會寫入網址）</span><input name="admin_key" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off" /></label>
          <button class="primary-btn" type="submit">解鎖修改功能</button>
        </form>
        <p id="admin-status" class="status-line">未解鎖時仍可查看統計，但不能修改最終時間。</p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <p class="eyebrow">Calendar</p>
          <h2>時段統計</h2>
        </div>
        <div id="stats-grid" class="calendar-grid"></div>
      </section>

      <section class="dashboard-grid">
        <div class="panel">
          <div class="section-heading">
            <p class="eyebrow">Recommendation</p>
            <h2>推薦時段</h2>
          </div>
          <ol id="recommendations" class="recommend-list"></ol>
        </div>

        <div class="panel">
          <div class="section-heading">
            <p class="eyebrow">Final</p>
            <h2>最終時間</h2>
          </div>
          <div id="final-panel"></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <p class="eyebrow">Participants</p>
          <h2>參加者回覆</h2>
        </div>
        <div class="table-wrap">
          <table id="participant-table">
            <thead>
              <tr><th>姓名</th><th>已選時段</th><th>最後更新</th><th>備註</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="./js/results.js"></script>
  </body>
</html>
